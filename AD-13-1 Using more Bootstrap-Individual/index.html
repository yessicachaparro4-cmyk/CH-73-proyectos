
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio 3 - Bootstrap</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos personalizados -->
  <link href="style.css" rel="stylesheet">
</head>

<body>

  <!-- Tarea 5: Barra de navegación -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Bootstrap Lab 3</a>

      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Abrir navegación">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index2.html">index2</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-4">

    <h1 class="text-center mb-4">
      Laboratorio 3 - Componentes Bootstrap
    </h1>

    <!-- Tarea 2: Alertas dinámicas -->
    <section class="mb-5">
      <h2>Alertas dinámicas</h2>

      <div id="alertPlaceholder"></div>

      <button type="button" class="btn btn-primary"
        id="alertButton">
        El Botón
      </button>
    </section>

    <!-- Tarea 3: Sistema de cuadrícula -->
    <section class="mb-5">
      <h2>Diseño con Grid</h2>

      <div class="container d-flex flex-column">

        <div class="row text-center w-100">

          <div class="col-md-2 bg-info p-3">
            el lado izquierdo
          </div>

          <div class="col-md-8 bg-light p-3">
            el lado central
          </div>

          <div class="col-md-2 bg-info p-3">
            el lado derecho
          </div>

        </div>

        <div class="row text-center w-100">
          <div class="col-12 bg-secondary text-white p-3">
            Pie de página
          </div>
        </div>

      </div>
    </section>

    <!-- Tarea 4: Formulario -->
    <section class="mb-5">
      <h2>Formulario de contacto</h2>

      <form id="contactForm">

        <div class="mb-3">
          <label for="email" class="form-label">
            Correo electrónico
          </label>

          <input type="email"
            class="form-control"
            id="email"
            placeholder="nombre@ejemplo.com"
            required>
        </div>

        <div class="mb-3">
          <label for="mensaje" class="form-label">
            Mensaje
          </label>

          <textarea class="form-control"
            id="mensaje"
            rows="4"
            placeholder="Escribe tu mensaje"
            required></textarea>
        </div>

        <button type="submit" class="btn btn-success">
          Enviar
        </button>

      </form>

      <div id="formMessage" class="mt-3" aria-live="polite"></div>
    </section>

  </main>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Alertas y formulario -->
  <script>
    const alertPlaceholder = document.getElementById("alertPlaceholder");

    document.getElementById("alertButton").addEventListener("click", function () {
      alertPlaceholder.innerHTML = `
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
          Alerta, alguien presionó el botón
          <button type="button" class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Cerrar"></button>
        </div>
      `;
    });

    document.getElementById("contactForm").addEventListener("submit", function (event) {
      event.preventDefault();

      document.getElementById("formMessage").textContent =
        "Formulario enviado correctamente.";

      this.reset();
    });
  </script>

</body>
</html>
